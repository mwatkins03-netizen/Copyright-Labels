<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Only Label · Handout (print to PDF)</title>
<meta name="robots" content="noai, noimageai">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
  @page { size: letter; margin: 0.9in 1in 1.25in 1in; }
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; color: #18171c; font-size: 11pt; line-height: 1.45; background: #e9e9ec; }
  .sheet { background: #fff; max-width: 8.5in; margin: 0 auto; padding: 0.9in 1in 1.4in; min-height: 11in; box-sizing: border-box; position: relative; }
  .bar { position: sticky; top: 0; z-index: 2; background: #18171c; color: #fff; font-family: Barlow, Arial, sans-serif; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .bar button { font: inherit; font-weight: 600; background: #fff; color: #18171c; border: 0; padding: 8px 14px; cursor: pointer; }
  .box { background: #FFF4C2; border: 2px solid #B8860B; padding: 10px 14px; margin: 0 0 16px; font-family: Arial, sans-serif; font-size: 10.5pt; }
  .box small { color: #55555c; display: block; font-size: 8.5pt; margin-bottom: 4px; }
  .box b.t { display: block; font-size: 12pt; margin-bottom: 6px; }
  .box ul { margin: 0; padding-left: 18px; } .box li { margin-bottom: 3px; }
  h1 { font-family: Arial, sans-serif; font-size: 20pt; margin: 0 0 4px; }
  .sub { color: #55555c; margin: 0 0 12px; }
  h2 { font-family: Arial, sans-serif; font-size: 13pt; margin: 18px 0 6px; }
  .label { border: 1px solid #18171c; background: #F7F7F8; padding: 10px 12px; margin: 10px 0 16px; break-inside: avoid; }
  .label img { width: 3.8in; display: block; margin-bottom: 8px; }
  .label .h { font-family: Arial, sans-serif; font-weight: 700; font-size: 11pt; }
  .label .s { font-size: 10.5pt; margin: 4px 0; }
  .label .l { font-size: 8.5pt; color: #55555c; margin: 4px 0 8px; overflow-wrap: anywhere; }
  .label pre { font-family: 'Courier New', monospace; font-size: 7.5pt; line-height: 1.35; color: #55555c; white-space: pre-wrap; margin: 0; overflow-wrap: anywhere; }
  .fill { color: #55555c; }
  .foot { position: fixed; left: 1in; right: 1in; bottom: 0.45in; border-top: 0.5pt solid #18171c; padding-top: 4pt; font-family: Arial, sans-serif; font-size: 7pt; line-height: 1.3; color: #55555c; overflow-wrap: anywhere; background: #fff; }
  .screen-foot { display: none; }
  @media screen { .foot { display: none; } .screen-foot { display: block; position: absolute; left: 1in; right: 1in; bottom: 0.45in; border-top: 0.5pt solid #18171c; padding-top: 4pt; font-family: Arial, sans-serif; font-size: 7pt; color: #55555c; overflow-wrap: anywhere; } }
  @media print { .bar { display: none; } body { background: #fff; } .sheet { margin: 0; padding: 0; max-width: none; min-height: 0; } .foot { display: block; } }
</style>
</head>
<body>
<div class="bar"><span><b>Print this page and choose "Save as PDF."</b> The footer repeats on every page. The yellow box prints too; delete it in your own version or keep it as a reminder.</span><button type="button" onclick="window.print()">Print / Save as PDF</button><a href="index.html" style="color:#fff;margin-left:auto">Back to Start</a></div>
<div class="sheet" id="sheet"></div>
<div class="foot" id="foot"></div>
<script src="assets/label.js"></script>
<script>
(function () {
  var C = window.COL, st = C.decode(location.hash); if (!st.holder) st.holder = 'Instructor';
  var base = new URL('label.html', location.href); var code = C.encodeShort(st);
  var urls = { label: base.href + '#' + code, prompt: base.href + '?prompt=1#' + code }; st.terms = st.terms || urls.label;
  var L = C.LEVELS[st.level]; var u = C.universalText(st, urls).split('\n');
  var footer = 'CAMPUS ONLY LABEL ' + C.code(st) + ' · ' + L.name + ' (' + L.code + '). ' + C.studentLead(st) + (st.train === 0 ? ' No AI training.' : '') + ' Label: ' + urls.label;
  document.getElementById('foot').textContent = footer;
  var esc = C.esc; var fill = '<p class="fill">Your reading or handout text goes here. The structure is what matters: the label block once on page one, the one-line label in the footer of every page.</p>';
  C.badgePNG(st, 1320, function (blob) {
    var img = blob ? URL.createObjectURL(blob) : '';
    document.getElementById('sheet').innerHTML =
      '<div class="box"><small>INSTRUCTIONS FOR FACULTY (delete this box in your own document)</small><b class="t">Where the label goes on a handout or PDF</b><ul><li>The footer of every page, in 7 to 9 point type (already set on this page). A student who photographs or uploads any single page carries the label with it.</li><li>The full label block once, on page one, so the badge and the two sentences are seen before anyone reads.</li><li>In Word: Insert › Footer. In Google Docs: Insert › Headers &amp; footers. Then export to PDF; the footer survives.</li><li>Keep the grey notice as text. Pasted as an image, AI tools cannot read it.</li></ul></div>' +
      '<h1>' + esc(st.title || 'Reading handout') + '</h1><p class="sub">' + esc((st.inst || '') + ' · ' + st.holder) + '</p>' +
      '<div class="label">' + (img ? '<img src="' + img + '" alt="' + esc('Campus Only Label ' + C.code(st)) + '">' : '') + '<div class="h">' + esc(u[0]) + '</div><div class="s">' + esc(u[1]) + '</div><div class="l">' + esc(u[2]).replace('  ·  ', '<br>') + '</div><pre>' + esc(C.shortNotice(st)) + '</pre></div>' +
      '<h2>Section one</h2>' + fill + fill + '<h2>Section two</h2>' + fill + fill + fill + '<h2>Section three</h2>' + fill + fill +
      '<div class="screen-foot">' + esc(footer) + '</div>';
  });
})();
</script>
</body>
</html>
