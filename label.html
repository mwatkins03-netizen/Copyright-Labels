<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Only Label</title>
<meta name="robots" content="noai, noimageai">
<meta name="tdm-reservation" content="1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  body{background-image:none}
  main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
  .campus-only-label{margin:0 auto}
  .foot{margin-top:14px;font-size:.84rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .foot a{color:inherit}
  body.embed main{padding:8px}
  body.embed .foot{display:none}
  @media print{ .foot{display:none} }
</style>
</head>
<body>
<main id="main">
  <h1 id="ttl" class="small" style="font-size:var(--step-2);margin-bottom:12px"></h1>
  <div id="out"></div>
  <div class="foot"><span>Campus Only Label <span id="codeOut" class="mono"></span></span><span><a href="learn.html">What this label means</a> · <a href="https://github.com/mwatkins03-netizen/Copyright-Labels">Source and tests</a> · <a href="index.html" id="editLink">Build your own</a></span></div>
</main>
<script src="assets/label.js"></script>
<script>
(function () {
  var C = window.COL, q = new URLSearchParams(location.search);
  var st = C.decode(location.hash);
  if (q.get('embed') === '1') document.body.classList.add('embed');
  if (q.get('prompt') === '1') { document.getElementById('ttl').textContent = 'Ask your AI first'; document.getElementById('out').innerHTML = '<p style="max-width:62ch">Before you paste any course material into an AI tool, paste this message first. The assistant checks the label and replies STOP or PROCEED. A STOP means: open the material in Copilot or Gemini with your go.olemiss.edu account instead.</p><div class="actions" style="margin:8px 0 12px"><button class="btn primary" id="cp" type="button">Copy the prompt</button></div><textarea readonly id="pp" style="width:100%;min-height:320px;border:1px solid var(--on-surface);padding:10px;font-family:var(--font-mono);font-size:.78rem;line-height:1.5"></textarea>'; document.getElementById('pp').value = C.permissionPrompt(st); document.getElementById('cp').addEventListener('click', function () { C.copy(C.permissionPrompt(st), function (ok) { C.toast(ok ? 'Copied' : 'Copy failed'); }); }); document.getElementById('codeOut').textContent = C.code(st); document.getElementById('editLink').href = 'index.html#' + C.encodeShort(st); return; }
  document.getElementById('ttl').textContent = st.title || '';
  document.title = (st.title ? st.title + ' · ' : '') + 'Campus Only Label ' + C.LEVELS[st.level].code;
  if (!st.terms) st.terms = location.href.split(/[?#]/)[0] + '#' + C.encodeShort(st); document.getElementById('out').innerHTML = C.inlineHTML(st);
  document.getElementById('codeOut').textContent = C.code(st);
  document.getElementById('editLink').href = 'builder.html#' + C.encodeShort(st);
  var ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.textContent = C.jsonLD(st); document.head.appendChild(ld);
  var m = document.createElement('meta'); m.name = 'campus-only-label'; m.content = C.code(st); document.head.appendChild(m);
  if (location.hash.indexOf('print=1') > -1 || q.get('print') === '1') setTimeout(function () { window.print(); }, 600);
})();
</script>
</body>
</html>
